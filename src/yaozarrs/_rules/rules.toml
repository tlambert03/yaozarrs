          {
            "axes": [
              {"name": "y", "type": "space"},
              {"name": "x", "type": "space"}
            ],
            "datasets": [
              {
                "path": "s0",
                "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
              }
            ]
          }
        ]
      }
    }
  },
  "s0/zarr.json": {
    "zarr_format": 3,
    "node_type": "array",
    "shape": [4, 4],
    "data_type": "uint8",
    "dimension_names": ["y", "x"]
  },
  "labels/zarr.json": {
    "zarr_format": 3,
    "node_type": "array",
    "shape": [4, 4],
    "data_type": "uint8",
    "dimension_names": ["y", "x"]
  }
}
'''

[rules.NGFF-LB-002]
slug = 'labels-paths-exist'
level = 'MUST'
summary = 'Each path listed in `labels` must point to a label image group.'
introduced = '0.4'
notes = "0.4 states this without an RFC 2119 keyword. The 0.5 wording comes from [ome/ngff#165](https://github.com/ome/ngff/pull/165), a labels rewrite that set out to \"keep the actual spec the same, and just improve the language explaining it\", so the requirement is taken to apply to 0.4 too."

[[rules.NGFF-LB-002.sources]]
quote = 'MUST contain a JSON object with the key `labels`, whose value is a JSON array of paths to the labeled multiscale image(s).'
lines = { "0.5" = [404, 405] }

