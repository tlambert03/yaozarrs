[rules.NGFF-LB-003]
slug = 'label-pixels-integer'
level = 'MUST'
summary = 'Label image arrays must have an integer data type.'
introduced = '0.4'
notes = "0.4 states this without an RFC 2119 keyword. The 0.5 wording comes from [ome/ngff#165](https://github.com/ome/ngff/pull/165), a labels rewrite that set out to \"keep the actual spec the same, and just improve the language explaining it\", so the requirement is taken to apply to 0.4 too. In 0.4 it appears only in a comment in the example directory layout (\"only integer values are supported\")."

[[rules.NGFF-LB-003.sources]]
