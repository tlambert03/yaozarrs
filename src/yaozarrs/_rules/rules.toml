[rules.NGFF-CT-026]
slug = 'rotation-same-ndim'
level = 'MUST'
summary = 'The input and output of a `rotation` must have the same dimensionality.'
introduced = '0.6'

[[rules.NGFF-CT-026.sources]]
quote = 'Input and output dimensionality (N) MUST be identical.'
lines = { "0.6" = [962, 962] }

[rules.NGFF-CT-026.examples."0.6"]
model = 'Multiscale'
json = '''
{"coordinateSystems": [{"name": "physical", "axes": [{"name": "y", "type": "space"}, {"name": "x", "type": "space"}]}, {"name": "other", "axes": [{"name": "z", "type": "space"}, {"name": "y", "type": "space"}, {"name": "x", "type": "space"}]}], "datasets": [{"path": "s0", "coordinateTransformations": [{"type": "scale", "scale": [1, 1], "input": {"path": "s0"}, "output": {"name": "physical"}}]}], "coordinateTransformations": [{"type": "rotation", "path": "m", "input": {"name": "physical"}, "output": {"name": "other"}}]}
'''


[rules.NGFF-CT-027]
slug = 'rotation-orthonormal'
level = 'MUST'
summary = 'A `rotation` matrix must have determinant 1, with orthonormal rows and columns.'
introduced = '0.6'
notes = 'The spec defines no tolerance; yaozarrs allows 1e-4.'

[[rules.NGFF-CT-027.sources]]
quote = 'and MUST have determinant equal to one, with orthonormal rows and columns.'
lines = { "0.6" = [964, 964] }

[rules.NGFF-CT-027.examples."0.6"]
model = 'RotationTransformation'
json = '''
{"rotation": [[2, 0], [0, 2]]}
'''


[rules.NGFF-CT-028]
slug = 'rotation-matrix-stored'
level = 'MUST'
summary = 'A `rotation` must have its matrix either inline or in a Zarr array at `path`.'
introduced = '0.6'
notes = 'yaozarrs rejects a transformation with both.'

[[rules.NGFF-CT-028.sources]]
quote = 'The matrix MUST be stored as a 2D array either as json or in a Zarr array.'
lines = { "0.6" = [965, 965] }

