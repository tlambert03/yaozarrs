quote = 'Each of these objects MUST contain the `label-value` key'
lines = { "0.5" = [431, 431], "0.6" = [1508, 1508] }

[rules.NGFF-IL-006.example]
model = 'LabelColor'
json = '''
{"rgba": [255, 0, 0, 255]}
'''

[rules.NGFF-IL-007]
slug = 'label-color-value-integer'
level = 'MUST'
summary = "A `colors` entry's `label-value` must be an integer."
introduced = '0.5'

[[rules.NGFF-IL-007.sources]]
quote = 'whose value MUST be the integer corresponding to a particular label'
lines = { "0.5" = [431, 432], "0.6" = [1508, 1508] }

[rules.NGFF-IL-007.example]
model = 'LabelColor'
json = '''
{"label-value": 1.5}
'''

[rules.NGFF-IL-008]
slug = 'label-color-rgba'
level = 'MUST'
summary = "A `colors` entry's `rgba`, if present, must be an array of four integers from 0 to 255."
introduced = '0.4'
notes = 'The 0.4 spec states this value without a binding keyword: its MAY is about the key being present.'

[[rules.NGFF-IL-008.sources]]
quote = 'the objects in this array MAY contain an `rgba` key whose value MUST be an array of four integers between 0 and 255, inclusive.'
lines = { "0.5" = [432, 433], "0.6" = [1509, 1510] }

[[rules.NGFF-IL-008.sources]]
quote = 'the "rgba" key MAY be present, the value for which is an RGBA unsigned-int 4-tuple: `[uint8, uint8, uint8, uint8]`'
implied = true
lines = { "0.4" = [467, 468] }

[rules.NGFF-IL-008.example]
model = 'LabelColor'
json = '''
{"label-value": 1, "rgba": [255, 0, 300, 255]}
'''

[rules.NGFF-IL-009]
slug = 'image-label-properties-array'
level = 'MUST'
summary = '`image-label` `properties` must be an array of objects.'
introduced = '0.4'
notes = 'The 0.4 spec states this without a keyword. An empty list is NGFF-IL-016, and identical entries are NGFF-IL-017.'

[[rules.NGFF-IL-009.sources]]
quote = 'the value of the `properties` key MUST be an array of JSON objects'
lines = { "0.5" = [439, 439], "0.6" = [1517, 1517] }

[[rules.NGFF-IL-009.sources]]
quote = 'The `properties` key defines a list of JSON objects which also describes the unique label values.'
implied = true
lines = { "0.4" = [475, 476] }

[rules.NGFF-IL-009.example]
model = 'ImageLabel'
json = '''
{"properties": {"label-value": 1}}
'''

[rules.NGFF-IL-010]
slug = 'label-property-value-present'
level = 'MUST'
summary = 'Each entry in `properties` must contain `label-value`.'
introduced = '0.4'

[[rules.NGFF-IL-010.sources]]
quote = 'Each entry in the list MUST contain the key "label-value" with the pixel value for that label. Additionally, an arbitrary number of key-value pairs'
lines = { "0.4" = [476, 477] }

[[rules.NGFF-IL-010.sources]]
quote = 'Each object in the `properties` array MUST contain the `label-value` key'
lines = { "0.5" = [440, 440], "0.6" = [1518, 1518] }

[rules.NGFF-IL-010.example]
model = 'LabelProperty'
json = '''
{"class": "cell"}
'''

[rules.NGFF-IL-011]
slug = 'label-property-value-integer'
level = 'MUST'
summary = "A `properties` entry's `label-value` must be an integer."
introduced = '0.5'

[[rules.NGFF-IL-011.sources]]
quote = 'whose value again MUST be an integer specifying the pixel value for that label'
lines = { "0.5" = [440, 440], "0.6" = [1519, 1519] }

[rules.NGFF-IL-011.example]
model = 'LabelProperty'
json = '''
{"label-value": "one"}
'''

[rules.NGFF-IL-012]
slug = 'image-label-source-object'
level = 'MUST'
summary = '`image-label` `source` must be an object.'
introduced = '0.4'
notes = 'The 0.4 spec states this without a keyword.'

[[rules.NGFF-IL-012.sources]]
quote = 'The value of the `source` key MUST be a JSON object'
lines = { "0.5" = [444, 444], "0.6" = [1524, 1524] }

[[rules.NGFF-IL-012.sources]]
quote = 'The `source` key is an optional dictionary which contains information on the image the label is associated with.'
implied = true
lines = { "0.4" = [481, 482] }

[rules.NGFF-IL-012.example]
model = 'ImageLabel'
json = '''
{"source": "../../"}
'''

[rules.NGFF-IL-013]
slug = 'image-label-source-image-string'
level = 'MUST'
summary = '`image-label` `source.image`, if present, must be a string.'
introduced = '0.4'
notes = 'The 0.4 spec states this without a binding keyword: its MAY is about the key being present.'

[[rules.NGFF-IL-013.sources]]
quote = 'This object MAY include a key `image`, whose value MUST be a string'
lines = { "0.5" = [445, 445], "0.6" = [1525, 1525] }

[[rules.NGFF-IL-013.sources]]
quote = 'If included it MAY include a key `image` whose value is the relative path to a Zarr image group.'
implied = true
lines = { "0.4" = [482, 483] }

[rules.NGFF-IL-013.example]
model = 'LabelSource'
json = '''
{"image": 1}
'''

[rules.NGFF-IL-014]
slug = 'image-label-colors-nonempty'
