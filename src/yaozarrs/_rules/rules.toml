[rules.NGFF-IL-004]
slug = 'label-source-image-is-image-group'
level = 'MUST'
summary = 'An `image-label` `source.image` path must point to an image group.'
introduced = '0.5'
notes = '0.4 only says that `image` MAY be included; it states no requirement on the path.'

[[rules.NGFF-IL-004.sources]]
quote = 'This object MAY include a key `image`, whose value MUST be a string specifying the relative path to a Zarr image group.'
lines = { "0.5" = [445, 445] }

[rules.NGFF-IL-004.example]
store = '''
{
  "zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {
      "ome": {
        "version": "0.5",
        "multiscales": [
          {
            "axes": [
              {"name": "y", "type": "space"},
              {"name": "x", "type": "space"}
            ],
            "datasets": [
              {
                "path": "s0",
                "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
              }
            ]
          }
        ],
        "image-label": {"source": {"image": "../missing"}}
      }
    }
