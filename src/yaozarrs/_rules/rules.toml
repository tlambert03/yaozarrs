# ------------------------------------------------------------------------------
# NGFF-SC
# ------------------------------------------------------------------------------

[rules.NGFF-SC-001]
slug = 'scene-transforms-present'
level = 'MUST'
summary = 'A `scene` must contain `coordinateTransformations`.'
introduced = '0.6'

[[rules.NGFF-SC-001.sources]]
quote = 'The `scene` object MUST contain the field `coordinateTransformations`,'
lines = { "0.6" = [1712, 1712] }

[rules.NGFF-SC-001.examples."0.6"]
model = 'SceneDef'
json = '''
{}
'''


[rules.NGFF-SC-002]
slug = 'scene-transforms-valid'
level = 'MUST'
summary = "A `scene`'s `coordinateTransformations` must be an array of valid transformations."
introduced = '0.6'

[[rules.NGFF-SC-002.sources]]
quote = 'whose value MUST be an array of valid [transformations](#trafo-types-md).'
lines = { "0.6" = [1713, 1713] }

[rules.NGFF-SC-002.examples."0.6"]
model = 'SceneDef'
json = '''
{"coordinateTransformations": 1}
'''


[rules.NGFF-SC-003]
slug = 'scene-coordinate-systems-valid'
level = 'MUST'
summary = "A `scene`'s `coordinateSystems`, if present, must be an array of valid coordinate systems."
introduced = '0.6'

[[rules.NGFF-SC-003.sources]]
quote = 'whose values MUST be an array of valid [coordinate systems](#coordinate-systems-md).'
lines = { "0.6" = [1715, 1715] }

[rules.NGFF-SC-003.examples."0.6"]
model = 'SceneDef'
json = '''
{"coordinateTransformations": [{"type": "identity", "input": {"name": "a"}, "output": {"name": "b"}}], "coordinateSystems": 1}
'''


[rules.NGFF-SC-004]
slug = 'scene-transform-input-output'
level = 'MUST'
summary = 'Transformations in a `scene` must have an `input` and an `output`.'
introduced = '0.6'

[[rules.NGFF-SC-004.sources]]
quote = 'If used inside `scene` metadata, the `input` and `output` fields of `coordinateTransformations` MUST contain a json object,'
lines = { "0.6" = [1717, 1717] }

[rules.NGFF-SC-004.examples."0.6"]
model = 'SceneDef'
json = '''
{"coordinateTransformations": [{"type": "identity"}]}
'''


[rules.NGFF-SC-005]
slug = 'scene-transform-reference-name'
level = 'MUST'
summary = 'The `input` and `output` of a transformation in a `scene` must contain `name`.'
introduced = '0.6'

[[rules.NGFF-SC-005.sources]]
quote = 'which MUST contain the field `name` and MAY contain the field `path`.'
lines = { "0.6" = [1718, 1718] }

[rules.NGFF-SC-005.examples."0.6"]
model = 'SceneDef'
json = '''
{"coordinateTransformations": [{"type": "identity", "input": {"path": "a"}, "output": {"name": "b", "path": "b"}}]}
'''


[rules.NGFF-SC-006]
slug = 'scene-transform-reference-path'
level = 'MUST'
summary = "A reference in a `scene` to a coordinate system in an image must have both `path` and `name`, so one without `path` must be in the scene's `coordinateSystems`."
introduced = '0.6'

[[rules.NGFF-SC-006.sources]]
quote = 'If `name` refers to a coordinate system in the multiscale image subgroup specified by `path`, both `path` and `name` MUST be provided.'
lines = { "0.6" = [1729, 1730] }

[rules.NGFF-SC-006.examples."0.6"]
model = 'SceneDef'
json = '''
{"coordinateTransformations": [{"type": "identity", "input": {"name": "a"}, "output": {"name": "b"}}]}
'''


[rules.NGFF-SC-007]
slug = 'scene-transform-reference-resolves'
level = 'MUST'
summary = 'A reference in a `scene` must resolve to a coordinate system in the multiscale image subgroup at `path`.'
introduced = '0.6'
notes = "The 0.6 spec describes what these fields refer to without a keyword; a reference that doesn't resolve can't mean anything."

[[rules.NGFF-SC-007.sources]]
quote = '**name** Refers to the name of a `coordinateSystem` either in the multiscale image subgroup specified by the path, or within the `scene` object itself.'
implied = true
lines = { "0.6" = [1720, 1722] }

[rules.NGFF-SC-007.examples."0.6"]
store = '''
{
  "zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {
      "ome": {
        "version": "0.6",
        "scene": {
          "coordinateSystems": [
            {
              "name": "a",
              "axes": [
                {
                  "name": "y",
                  "type": "space"
                },
                {
                  "name": "x",
                  "type": "space"
                }
              ]
            }
          ],
          "coordinateTransformations": [
            {
              "type": "identity",
              "input": {
                "name": "a"
              },
              "output": {
                "name": "physical",
                "path": "missing"
              }
            }
          ]
        }
      }
    }
  }
}
'''

# ------------------------------------------------------------------------------
# NGFF-GN
# ------------------------------------------------------------------------------

[rules.NGFF-GN-001]
slug = 'ome-version-present'
level = 'MUST'
summary = 'The `ome` object must contain a `version` key.'
introduced = '0.5'
notes = 'The 0.5 spec only says that the version is denoted by this attribute, without a keyword.'

[[rules.NGFF-GN-001.sources]]
quote = 'object that MUST contain a `version` key,'
lines = { "0.6" = [181, 181] }

[[rules.NGFF-GN-001.sources]]
quote = 'The version of the OME-Zarr Metadata is denoted as a string in the `version` attribute within the `ome` namespace.'
implied = true
lines = { "0.5" = [163, 163] }

[rules.NGFF-GN-001.example]
model = 'Image'
json = '''
{"multiscales": []}
'''

# ------------------------------------------------------------------------------
# YZ
# ------------------------------------------------------------------------------

[rules.YZ-001]
slug = 'zarr-node-name-invalid'
summary = 'A path used as a Zarr node name violates the Zarr v3 node-name rules.'
severity = 'error'
notes = 'See the [Zarr v3 node names](https://zarr-specs.readthedocs.io/en/latest/v3/core/index.html#node-names) rules.'

[rules.YZ-001.example]
model = 'Dataset'
json = '''
{
  "path": "__x",
  "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
}
'''

[rules.YZ-002]
slug = 'zarr-node-name-risky'
summary = 'A path used as a Zarr node name contains characters outside `[A-Za-z0-9._-]`, which can cause problems on some filesystems or in URLs.'
severity = 'warning'
notes = 'Set `YAOZARRS_ALLOW_RISKY_NODE_NAMES=1` to silence this warning.'

[rules.YZ-002.example]
model = 'Dataset'
json = '''
{
  "path": "a b",
  "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
}
'''

[rules.YZ-003]
slug = 'label-multiscales-count-matches-image'
summary = 'A label image must have the same number of `multiscales` as its image.'
severity = 'error'
notes = "The spec doesn't state this directly, but it is needed to pair each label multiscale with an image multiscale for NGFF-IL-002."

[rules.YZ-003.example]
store = '''
{
  "zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {
      "ome": {
        "version": "0.5",
        "multiscales": [
          {
            "axes": [
              {"name": "y", "type": "space"},
              {"name": "x", "type": "space"}
            ],
            "datasets": [
              {
                "path": "s0",
                "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
              }
            ]
          }
        ]
      }
    }
  },
  "s0/zarr.json": {
    "zarr_format": 3,
    "node_type": "array",
    "shape": [4, 4],
    "data_type": "uint8",
    "dimension_names": ["y", "x"]
  },
  "labels/zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {"ome": {"version": "0.5", "labels": ["annotations"]}}
  },
  "labels/annotations/zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {
      "ome": {
        "version": "0.5",
        "multiscales": [
          {
            "axes": [
              {"name": "y", "type": "space"},
              {"name": "x", "type": "space"}
            ],
            "datasets": [
              {
                "path": "s0",
                "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
              }
            ]
          },
          {
            "name": "second",
            "axes": [
              {"name": "y", "type": "space"},
              {"name": "x", "type": "space"}
            ],
            "datasets": [
              {
                "path": "s0",
                "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
              }
            ]
          }
        ],
        "image-label": {}
      }
    }
  },
  "labels/annotations/s0/zarr.json": {
    "zarr_format": 3,
    "node_type": "array",
    "shape": [4, 4],
    "data_type": "uint8",
    "dimension_names": ["y", "x"]
  }
}
'''

[rules.YZ-005]
slug = 'version-prerelease'
summary = 'The document declares a pre-release of a spec version.'
severity = 'warning'
notes = "The 0.6 schema accepts the release candidate `0.6rc0`. `0.6.dev4` isn't in the schema, but much of the 0.6 data written so far uses it."

[rules.YZ-005.examples."0.6"]
model = 'Bf2Raw'
json = '''
{"version": "0.6rc0", "bioformats2raw.layout": 3}
'''

[rules.YZ-006]
slug = 'version-unsupported'
summary = 'The store declares an OME-Zarr version that yaozarrs does not know.'
severity = 'error'

[rules.YZ-006.examples."0.5"]
store = '''
{
  "zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {
      "ome": {
        "version": "9.9",
        "multiscales": []
      }
    }
  }
}
'''

[rules.YZ-007]
slug = 'transform-path-relative'
summary = "The `path` of a transformation's parameters must be a relative path with no empty, `.` or `..` segments."
severity = 'error'
notes = 'The 0.6 spec only says "a location in this container". Like ngff-zarr, yaozarrs rejects paths whose meaning nothing defines.'

[rules.YZ-007.examples."0.6"]
store = '''
{
  "zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {
      "ome": {
        "version": "0.6",
        "multiscales": [
          {
            "coordinateSystems": [
              {
                "name": "physical",
                "axes": [
                  {
                    "name": "y",
                    "type": "space"
                  },
                  {
                    "name": "x",
                    "type": "space"
                  }
                ]
              },
              {
                "name": "other",
                "axes": [
                  {
                    "name": "y",
                    "type": "space"
                  },
                  {
                    "name": "x",
                    "type": "space"
                  }
                ]
              }
            ],
            "datasets": [
              {
                "path": "s0",
                "coordinateTransformations": [
                  {
                    "type": "scale",
                    "scale": [
                      1,
                      1
                    ],
                    "input": {
                      "path": "s0"
                    },
                    "output": {
                      "name": "physical"
                    }
                  }
                ]
              }
            ],
            "coordinateTransformations": [
              {
                "type": "affine",
                "path": "../m",
                "input": {
                  "name": "physical"
                },
                "output": {
                  "name": "other"
                }
              }
            ]
          }
        ]
      }
    }
  },
  "s0/zarr.json": {
    "zarr_format": 3,
    "node_type": "array",
    "shape": [
      1,
      1
    ],
    "data_type": "uint8"
  }
}
'''

