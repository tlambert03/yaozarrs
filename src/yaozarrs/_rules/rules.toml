[rules.NGFF-IL-016]
slug = 'image-label-properties-nonempty'
level = 'MUST'
summary = '`image-label` `properties`, if present, must have at least one entry.'
introduced = '0.5'

[[rules.NGFF-IL-016.sources]]
quote = '"required": [ "label-value" ] }, "minItems": 1, "uniqueItems": true }, "source": {'
