[[rules.NGFF-OM-001.sources]]
quote = 'Each object in `channels` MUST contain the field `color`, which is a string of 6 hexadecimal digits specifying the color of the channel in RGB format.'
lines = { "0.6" = [1456, 1457] }

[rules.NGFF-OM-001.example]
model = 'OmeroChannel'
