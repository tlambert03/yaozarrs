          {
            "axes": [
              {"name": "y", "type": "space"},
              {"name": "x", "type": "space"}
            ],
            "datasets": [
              {
                "path": "s0",
                "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
              }
            ]
          }
        ]
      }
