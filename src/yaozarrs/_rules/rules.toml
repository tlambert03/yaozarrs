{"coordinateSystems": [{"name": "physical", "axes": [{"name": "y", "type": "space"}, {"name": "x", "type": "space"}]}, {"name": "other", "axes": [{"name": "z", "type": "space"}, {"name": "y", "type": "space"}, {"name": "x", "type": "space"}]}], "datasets": [{"path": "s0", "coordinateTransformations": [{"type": "scale", "scale": [1, 1], "input": {"path": "s0"}, "output": {"name": "physical"}}]}], "coordinateTransformations": [{"type": "bijection", "forward": {"type": "coordinates", "path": "f"}, "inverse": {"type": "coordinates", "path": "i"}, "input": {"name": "physical"}, "output": {"name": "other"}}]}
'''


[rules.NGFF-CT-041]
slug = 'bijection-directions-match'
level = 'MUST'
summary = 'The forward and inverse of a `bijection` must match its input and output dimensionality.'
introduced = '0.6'

[[rules.NGFF-CT-041.sources]]
quote = "The input and output dimensions for the both the forward and inverse transformations MUST match bijection's input and output space dimensions."
lines = { "0.6" = [1233, 1234] }

[rules.NGFF-CT-041.examples."0.6"]
model = 'Multiscale'
json = '''
{"coordinateSystems": [{"name": "physical", "axes": [{"name": "y", "type": "space"}, {"name": "x", "type": "space"}]}, {"name": "other", "axes": [{"name": "y", "type": "space"}, {"name": "x", "type": "space"}]}], "datasets": [{"path": "s0", "coordinateTransformations": [{"type": "scale", "scale": [1, 1], "input": {"path": "s0"}, "output": {"name": "physical"}}]}], "coordinateTransformations": [{"type": "bijection", "forward": {"type": "scale", "scale": [2]}, "inverse": {"type": "coordinates", "path": "i"}, "input": {"name": "physical"}, "output": {"name": "other"}}]}
'''


[rules.NGFF-CT-042]
slug = 'transform-graph-connected'
level = 'MUST'
summary = 'The coordinate systems and transformations of the metadata must form a connected graph.'
introduced = '0.6'
notes = 'The statement covers the multiscales and scene metadata combined, so outside of a scene (where a scene could still link the coordinate systems) yaozarrs only warns.'

[[rules.NGFF-CT-042.sources]]
quote = 'The graph MUST be connected (but need not be complete):'
lines = { "0.6" = [482, 482] }

[rules.NGFF-CT-042.examples."0.6"]
store = '''
{
  "zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {
      "ome": {
        "version": "0.6",
        "multiscales": [
          {
            "coordinateSystems": [
              {
                "name": "physical",
                "axes": [
                  {
                    "name": "y",
                    "type": "space"
                  },
                  {
                    "name": "x",
                    "type": "space"
                  }
                ]
              },
              {
                "name": "other",
                "axes": [
                  {
                    "name": "y",
                    "type": "space"
                  },
                  {
                    "name": "x",
                    "type": "space"
                  }
                ]
              }
            ],
            "datasets": [
              {
                "path": "s0",
                "coordinateTransformations": [
                  {
                    "type": "scale",
                    "scale": [
                      1,
                      1
                    ],
                    "input": {
                      "path": "s0"
                    },
                    "output": {
                      "name": "physical"
                    }
                  }
                ]
              }
            ]
          }
        ]
      }
    }
  },
  "s0/zarr.json": {
    "zarr_format": 3,
    "node_type": "array",
    "shape": [
      1,
      1
    ],
    "data_type": "uint8"
  }
}
'''


[rules.NGFF-CT-043]
slug = 'transform-parameters-location'
level = 'SHOULD'
summary = 'In a scene, arrays with transformation parameters should be in a group called `coordinateTransformations`.'
introduced = '0.6'

[[rules.NGFF-CT-043.sources]]
quote = 'those Zarr arrays SHOULD be stored in a Zarr group on the same level as images called "coordinateTransformations".'
lines = { "0.6" = [145, 145] }

[rules.NGFF-CT-043.examples."0.6"]
store = '''
{
  "zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {
      "ome": {
        "version": "0.6",
        "scene": {
          "coordinateSystems": [
            {
              "name": "a",
              "axes": [
                {
                  "name": "y",
                  "type": "space"
                },
                {
                  "name": "x",
                  "type": "space"
                }
              ]
            },
            {
              "name": "b",
              "axes": [
                {
                  "name": "y",
                  "type": "space"
                },
                {
                  "name": "x",
                  "type": "space"
                }
              ]
            }
          ],
          "coordinateTransformations": [
            {
              "type": "affine",
              "path": "m",
              "input": {
                "name": "a"
              },
              "output": {
                "name": "b"
              }
            }
          ]
        }
      }
    }
  },
  "m/zarr.json": {
    "zarr_format": 3,
    "node_type": "array",
    "shape": [
      2,
      3
    ],
    "data_type": "float64"
  }
}
'''

[rules.NGFF-CT-044]
slug = 'scale-positive'
level = 'MUST'
summary = 'Values in a `scale` array must be greater than 0.'
introduced = '0.6'
severity = 'warning'
notes = 'The JSON schema requires this of every `scale`, but the prose only says values SHOULD be non-zero (NGFF-CT-022) and allows negative ones. The spec editor confirmed that only positive values are meant for dataset scales (ome/ngff#637), so yaozarrs warns, and only for those.'

[[rules.NGFF-CT-044.sources]]
quote = '"type": "number", "exclusiveMinimum": 0'
schema = 'coordinate_transformations.schema'
lines = { "0.6" = [195, 196] }

[rules.NGFF-CT-044.examples."0.6"]
model = 'Dataset'
json = '''
{"path": "s0", "coordinateTransformations": [{"type": "scale", "scale": [-1, 1], "input": {"path": "s0"}, "output": {"name": "physical"}}]}
'''

[rules.NGFF-CT-045]
slug = 'project-axis-fields'
level = 'MUST'
summary = 'A `projectAxis` transformation must have `droppedInputs` or `createdOutputs`.'
introduced = '0.6'

[[rules.NGFF-CT-045.sources]]
quote = '"anyOf": [ {"required": ["droppedInputs"]}, {"required": ["createdOutputs"]} ]'
schema = 'coordinate_transformations.schema'
lines = { "0.6" = [176, 179] }

[rules.NGFF-CT-045.examples."0.6"]
model = 'ProjectAxisTransformation'
json = '''
{}
'''

