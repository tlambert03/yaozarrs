    "data_type": "uint8",
    "dimension_names": ["y", "x"]
  },
  "labels/zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {"ome": {"version": "0.5", "labels": ["annotations"]}}
  },
  "labels/annotations/zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {
      "ome": {
        "version": "0.5",
        "multiscales": [
          {
            "axes": [
              {"name": "y", "type": "space"},
              {"name": "x", "type": "space"}
            ],
            "datasets": [
              {
                "path": "s0",
                "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
              }
            ]
          },
          {
            "name": "second",
            "axes": [
              {"name": "y", "type": "space"},
