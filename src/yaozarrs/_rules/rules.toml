# ------------------------------------------------------------------------------
# NGFF-BF
# ------------------------------------------------------------------------------

[rules.NGFF-BF-001]
slug = 'bf2raw-numbered-image-groups'
level = 'MUST'
summary = 'Without `series` metadata, bioformats2raw images must be groups numbered consecutively from 0.'
introduced = '0.4'
notes = 'yaozarrs discovers images by probing `0/`, `1/`, ... and stops at the first missing number.'

[[rules.NGFF-BF-001.sources]]
quote = 'separate "multiscales" images MUST be stored in consecutively numbered groups starting from 0'
lines = { "0.4" = [322, 322], "0.5" = [263, 263] }

[rules.NGFF-BF-001.example]
store = '''
{
  "zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {"ome": {"version": "0.5", "bioformats2raw.layout": 3}}
  },
  "0/zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {
      "ome": {
        "version": "0.5",
        "multiscales": [
          {
            "axes": [
              {"name": "y", "type": "space"},
              {"name": "x", "type": "space"}
            ],
            "datasets": [
              {
                "path": "s0",
                "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
              }
            ]
          }
        ]
      }
    }
  },
  "0/s0/zarr.json": {
    "zarr_format": 3,
    "node_type": "array",
    "shape": [4, 4],
    "data_type": "uint8",
    "dimension_names": ["y", "x"]
  },
  "1/zarr.json": {
    "zarr_format": 3,
    "node_type": "array",
    "shape": [4, 4],
    "data_type": "uint8",
    "dimension_names": ["y", "x"]
  }
}
'''

[rules.NGFF-BF-002]
slug = 'bf2raw-series-paths'
level = 'MUST'
summary = "Each path in the OME group's \"series\" must point to an image group."
introduced = '0.4'

[[rules.NGFF-BF-002.sources]]
quote = '"series" MUST be a list of string objects, each of which is a path to an image group.'
lines = { "0.4" = [319, 319], "0.5" = [260, 260] }

[rules.NGFF-BF-002.example]
store = '''
{
  "zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {"ome": {"version": "0.5", "bioformats2raw.layout": 3}}
  },
  "0/zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {
      "ome": {
        "version": "0.5",
        "multiscales": [
          {
            "axes": [
              {"name": "y", "type": "space"},
              {"name": "x", "type": "space"}
            ],
            "datasets": [
              {
                "path": "s0",
                "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
              }
            ]
          }
        ]
      }
    }
  },
  "0/s0/zarr.json": {
    "zarr_format": 3,
    "node_type": "array",
    "shape": [4, 4],
    "data_type": "uint8",
    "dimension_names": ["y", "x"]
  },
  "OME/zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {"ome": {"version": "0.5", "series": ["0", "1"]}}
  }
}
'''

[rules.NGFF-BF-003]
slug = 'bf2raw-layout-3'
level = 'MUST'
summary = 'The top of a bioformats2raw hierarchy must have `"bioformats2raw.layout": 3`.'
introduced = '0.4'

