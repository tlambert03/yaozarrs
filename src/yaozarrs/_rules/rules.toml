            ],
            "datasets": [
              {
                "path": "s0",
                "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
              }
            ]
          }
        ],
        "image-label": {}
      }
    }
  },
  "labels/annotations/s0/zarr.json": {
    "zarr_format": 3,
    "node_type": "array",
    "shape": [4, 4],
    "data_type": "uint8",
