notes = 'The 0.6 spec states this in the transformation field table ("Required: yes, unless ..."), not with a keyword.'

[[rules.NGFF-CT-011.sources]]
quote = '| [`input`](#input-output-md) | object | yes, unless part of a wrapper transform'
implied = true
lines = { "0.6" = [401, 401] }

[[rules.NGFF-CT-011.sources]]
quote = '| [`output`](#input-output-md) | object | yes, unless part of a wrapper transform'
implied = true
lines = { "0.6" = [402, 402] }

[rules.NGFF-CT-011.examples."0.6"]
model = 'Multiscale'
