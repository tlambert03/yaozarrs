[rules.NGFF-CT-012]
slug = 'multiscale-transform-references-intrinsic'
level = 'MUST'
summary = "One of the `input` or `output` of a multiscale's transformation must be the intrinsic coordinate system."
introduced = '0.6'

[[rules.NGFF-CT-012.sources]]
quote = '- One of `input` or `output` MUST reference the "[intrinsic](#spec:hint:multiscales-intrinsic-coordinate-system)" coordinate system by `name` (`path` MAY be omitted or null). - The other of `input` or `output` MUST reference either:'
lines = { "0.6" = [1359, 1360] }

[rules.NGFF-CT-012.examples."0.6"]
model = 'Multiscale'
