'''


[rules.NGFF-CT-009]
slug = 'dataset-transform-output-path-omitted'
level = 'SHOULD'
summary = "The `output` of a dataset's transformation should not have a `path`."
introduced = '0.6'
notes = 'Another section of the 0.6 spec says these transformations "MUST ... omit `path`", so this is only a warning.'

