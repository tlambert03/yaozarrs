[[rules.NGFF-IL-015.sources]]
quote = '"required": [ "label-value" ] }, "minItems": 1, "uniqueItems": true }, "properties": {'
schema = 'label.schema'
lines = { "0.5" = [54, 61], "0.6" = [54, 61] }

