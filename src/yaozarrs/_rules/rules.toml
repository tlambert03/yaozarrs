# Registry of rule codes: one entry per normative statement in the NGFF spec
# (`NGFF-*`), plus checks yaozarrs adds beyond the spec (`YZ-*`).
#
# Codes are permanent: never renumber or reuse one. Line numbers are maintained by
# `uv run python scripts/ngff_rules.py check --fix`; never edit them by hand.
# See `.claude/skills/ngff-rules/SKILL.md` for how to add, change, or retire rules.

# Spec source files, pinned to immutable commits. Keys are the tracked versions.

[spec."0.4"]
tag = '0.4.1'
repo = 'ome/ngff'
sha = '106c3010dcb4079eb0a69868a11cc5943f942fdf'
path = '0.4/index.bs'

[spec."0.5"]
tag = '0.5.2'
repo = 'ome/ngff'
sha = '5cdf83b6806b5e500477c7af69dae9ed2adcf77d'
path = '0.5/index.bs'

# ------------------------------------------------------------------------------
# NGFF-AX
# ------------------------------------------------------------------------------

[rules.NGFF-AX-001]
slug = 'axis-name-unique'
level = 'MUST'
summary = 'Axis names must be unique within `axes`.'
introduced = '0.4'

[[rules.NGFF-AX-001.sources]]
quote = 'The values MUST be unique across all "name" fields.'
lines = { "0.4" = [243, 243], "0.5" = [183, 183] }

[rules.NGFF-AX-001.example]
model = 'Multiscale'
json = '''
{
  "axes": [
    {"name": "x", "type": "space"},
    {"name": "x", "type": "space", "unit": "meter"}
  ],
  "datasets": [
    {
      "path": "0",
      "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
    }
  ]
}
'''

[rules.NGFF-AX-002]
slug = 'axes-space-count'
level = 'MUST'
summary = '`axes` must contain 2 or 3 axes of type `space`.'
introduced = '0.4'

[[rules.NGFF-AX-002.sources]]
quote = 'The "axes" MUST contain 2 or 3 entries of "type:space"'
lines = { "0.4" = [360, 360], "0.5" = [304, 304] }

[rules.NGFF-AX-002.example]
model = 'Multiscale'
json = '''
{
  "axes": [{"name": "c", "type": "channel"}, {"name": "x", "type": "space"}],
  "datasets": [
    {
      "path": "0",
      "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
    }
  ]
}
'''

[rules.NGFF-AX-003]
slug = 'axes-time-at-most-one'
level = 'MAY'
summary = '`axes` may contain at most one axis of type `time`.'
introduced = '0.4'

[[rules.NGFF-AX-003.sources]]
quote = 'MAY contain one additional entry of "type:time"'
lines = { "0.4" = [360, 360], "0.5" = [304, 304] }

[rules.NGFF-AX-003.example]
model = 'Multiscale'
json = '''
{
  "axes": [
    {"name": "t", "type": "time"},
    {"name": "t2", "type": "time"},
    {"name": "y", "type": "space"},
    {"name": "x", "type": "space"}
  ],
  "datasets": [
    {
      "path": "0",
      "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
    }
  ]
}
'''

[rules.NGFF-AX-004]
slug = 'axes-channel-at-most-one'
level = 'MAY'
summary = '`axes` may contain at most one axis of type `channel` (or of a null/custom type).'
introduced = '0.4'
notes = 'yaozarrs currently only counts axes of type `channel`; multiple null/custom axes are not rejected.'

[[rules.NGFF-AX-004.sources]]
quote = 'MAY contain one additional entry of "type:channel" or a null / custom type'
lines = { "0.4" = [360, 360], "0.5" = [304, 304] }

[rules.NGFF-AX-004.example]
model = 'Multiscale'
json = '''
{
  "axes": [
    {"name": "c", "type": "channel"},
    {"name": "c2", "type": "channel"},
    {"name": "y", "type": "space"},
    {"name": "x", "type": "space"}
  ],
  "datasets": [
    {
      "path": "0",
      "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
    }
  ]
}
'''

[rules.NGFF-AX-005]
slug = 'axes-type-order'
level = 'MUST'
summary = 'Axes must be ordered by type: `time` (if present), then `channel` or custom (if present), then `space`.'
introduced = '0.4'

[[rules.NGFF-AX-005.sources]]
quote = 'the entries MUST be ordered by "type" where the "time" axis must come first (if present), followed by the "channel" or custom axis (if present) and the axes of type "space".'
lines = { "0.4" = [361, 361], "0.5" = [305, 305] }

[rules.NGFF-AX-005.example]
model = 'Multiscale'
json = '''
{
  "axes": [
    {"name": "y", "type": "space"},
    {"name": "t", "type": "time"},
    {"name": "x", "type": "space"}
  ],
  "datasets": [
    {
      "path": "0",
      "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
    }
  ]
}
'''

[rules.NGFF-AX-006]
slug = 'axis-unit-recognized'
level = 'SHOULD'
summary = 'An axis `unit` should be one of the UDUNITS-2 units in the spec.'
introduced = '0.4'
notes = 'yaozarrs checks this for `space` and `time` axes.'

[[rules.NGFF-AX-006.sources]]
quote = 'The value SHOULD be one of the following strings, which are valid units according to UDUNITS-2.'
lines = { "0.4" = [245, 245], "0.5" = [185, 185] }

[rules.NGFF-AX-006.example]
model = 'SpaceAxis'
json = '''
{"name": "x", "type": "space", "unit": "lightyear"}
'''


[rules.NGFF-AX-007]
slug = 'dimension-names-present'
level = 'MUST'
summary = "Each multiscale array's `zarr.json` must include `dimension_names`."
introduced = '0.5'
severity = 'warning'
notes = 'yaozarrs only warns, because zarr-python omits `dimension_names` unless it is passed explicitly.'

[[rules.NGFF-AX-007.sources]]
quote = 'The "dimension_names" attribute MUST be included in the `zarr.json` of the Zarr array of a multiscale level'
lines = { "0.5" = [191, 191] }

[rules.NGFF-AX-007.example]
store = '''
{
  "zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {
      "ome": {
        "version": "0.5",
        "multiscales": [
          {
            "axes": [
              {"name": "y", "type": "space"},
              {"name": "x", "type": "space"}
            ],
            "datasets": [
              {
                "path": "s0",
                "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
              }
            ]
          }
        ]
      }
    }
  },
  "s0/zarr.json": {
    "zarr_format": 3,
    "node_type": "array",
    "shape": [4, 4],
    "data_type": "uint8"
  }
}
'''

[rules.NGFF-AX-008]
slug = 'dimension-names-match-axes'
level = 'MUST'
summary = "An array's `dimension_names` must match the names in `axes`."
introduced = '0.5'
notes = 'For 0.4 stores, yaozarrs checks a non-standard `dimension_names` array attribute if it is present.'

[[rules.NGFF-AX-008.sources]]
quote = 'and MUST match the names in the "axes" metadata.'
lines = { "0.5" = [191, 191] }

[rules.NGFF-AX-008.example]
store = '''
{
  "zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {
      "ome": {
        "version": "0.5",
        "multiscales": [
          {
            "axes": [
              {"name": "y", "type": "space"},
              {"name": "x", "type": "space"}
            ],
            "datasets": [
              {
                "path": "s0",
                "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
              }
            ]
          }
        ]
      }
    }
  },
  "s0/zarr.json": {
    "zarr_format": 3,
    "node_type": "array",
    "shape": [4, 4],
    "data_type": "uint8",
    "dimension_names": ["a", "b"]
  }
}
'''
[rules.NGFF-AX-009]
slug = 'axis-name-present'
level = 'MUST'
summary = 'Each axis must have a `name`.'
introduced = '0.4'

[[rules.NGFF-AX-009.sources]]
quote = 'MUST contain the field "name" that gives the name for this dimension.'
lines = { "0.4" = [243, 243], "0.5" = [183, 183] }

[rules.NGFF-AX-009.example]
model = 'Multiscale'
json = '''
{
  "axes": [{"type": "space"}, {"name": "x", "type": "space"}],
  "datasets": [{"path": "0", "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]}]
}
'''

# ------------------------------------------------------------------------------
# NGFF-MS
# ------------------------------------------------------------------------------

[rules.NGFF-MS-001]
slug = 'multiscales-name'
level = 'SHOULD'
summary = 'Each "multiscales" dictionary should contain the field "name".'
introduced = '0.4'

[[rules.NGFF-MS-001.sources]]
quote = 'Each "multiscales" dictionary SHOULD contain the field "name".'
lines = { "0.4" = [380, 380], "0.5" = [324, 324] }

[rules.NGFF-MS-002]
slug = 'multiscales-axes-present'
level = 'MUST'
summary = 'Each "multiscales" entry must contain `axes`.'
introduced = '0.4'

[[rules.NGFF-MS-002.sources]]
quote = 'Each "multiscales" dictionary MUST contain the field "axes"'
lines = { "0.4" = [358, 358], "0.5" = [302, 302] }

[rules.NGFF-MS-002.example]
model = 'Multiscale'
json = '''
{
  "datasets": [{"path": "0", "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]}]
}
'''

[rules.NGFF-MS-003]
slug = 'multiscales-datasets-present'
level = 'MUST'
summary = 'Each "multiscales" entry must contain `datasets`.'
introduced = '0.4'

[[rules.NGFF-MS-003.sources]]
quote = 'Each "multiscales" dictionary MUST contain the field "datasets"'
lines = { "0.4" = [364, 364], "0.5" = [308, 308] }

[rules.NGFF-MS-003.example]
model = 'Multiscale'
json = '''
{"axes": [{"name": "y", "type": "space"}, {"name": "x", "type": "space"}]}
'''

# ------------------------------------------------------------------------------
# NGFF-DS
# ------------------------------------------------------------------------------

[rules.NGFF-DS-001]
slug = 'datasets-resolution-order'
level = 'MUST'
summary = '`datasets` must be ordered from highest to lowest resolution.'
introduced = '0.4'
notes = 'yaozarrs compares the `scale` values of the spatial axes.'

[[rules.NGFF-DS-001.sources]]
quote = 'The "path"s MUST be ordered from largest (i.e. highest resolution) to smallest.'
lines = { "0.4" = [366, 366], "0.5" = [310, 310] }

[rules.NGFF-DS-001.example]
model = 'Multiscale'
json = '''
{
  "axes": [{"name": "y", "type": "space"}, {"name": "x", "type": "space"}],
  "datasets": [
    {
      "path": "0",
      "coordinateTransformations": [{"type": "scale", "scale": [2, 2]}]
    },
    {
      "path": "1",
      "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
    }
  ]
}
'''

[rules.NGFF-DS-002]
slug = 'datasets-same-ndim'
level = 'MUST'
summary = 'All `datasets` must have the same number of dimensions.'
introduced = '0.4'
notes = "The spec does not define a dataset's number of dimensions; yaozarrs uses the length of its coordinate transformations."

[[rules.NGFF-DS-002.sources]]
quote = 'Each "datasets" dictionary MUST have the same number of dimensions'
lines = { "0.4" = [368, 368], "0.5" = [312, 312] }

[rules.NGFF-DS-002.example]
model = 'Multiscale'
json = '''
{
  "axes": [{"name": "y", "type": "space"}, {"name": "x", "type": "space"}],
  "datasets": [
    {
      "path": "0",
      "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
    },
    {
      "path": "1",
      "coordinateTransformations": [{"type": "scale", "scale": [2, 2, 2]}]
    }
  ]
}
'''

[rules.NGFF-DS-003]
slug = 'datasets-max-5d'
level = 'MUST NOT'
summary = '`datasets` must not have more than 5 dimensions.'
introduced = '0.4'

[[rules.NGFF-DS-003.sources]]
quote = 'MUST NOT have more than 5 dimensions.'
lines = { "0.4" = [368, 368], "0.5" = [312, 312] }

[rules.NGFF-DS-003.example]
model = 'Multiscale'
json = '''
{
  "axes": [{"name": "y", "type": "space"}, {"name": "x", "type": "space"}],
  "datasets": [
    {
      "path": "0",
      "coordinateTransformations": [{"type": "scale", "scale": [1, 1, 1, 1, 1, 1]}]
    }
  ]
}
'''


[rules.NGFF-DS-004]
slug = 'dataset-path-is-array'
level = 'MUST'
summary = 'Each `datasets` "path" must point to a Zarr array, relative to the image group.'
introduced = '0.4'

[[rules.NGFF-DS-004.sources]]
quote = 'Each dictionary in "datasets" MUST contain the field "path", whose value contains the path to the array for this resolution relative'
lines = { "0.4" = [365, 365], "0.5" = [309, 309] }

[rules.NGFF-DS-004.example]
store = '''
{
  "zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {
      "ome": {
        "version": "0.5",
        "multiscales": [
          {
            "axes": [
              {"name": "y", "type": "space"},
              {"name": "x", "type": "space"}
            ],
            "datasets": [
              {
                "path": "s0",
                "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
              }
            ]
          }
        ]
      }
    }
  }
}
'''

[rules.NGFF-DS-005]
slug = 'array-ndim-matches-axes'
level = 'MUST'
summary = 'Each multiscale array must have one dimension per axis.'
introduced = '0.4'

[[rules.NGFF-DS-005.sources]]
quote = 'MUST be equal to the dimensionality of the zarr arrays storing the image data (see "datasets:path").'
lines = { "0.4" = [359, 359], "0.5" = [303, 303] }

[rules.NGFF-DS-005.example]
store = '''
{
  "zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {
      "ome": {
        "version": "0.5",
        "multiscales": [
          {
            "axes": [
              {"name": "y", "type": "space"},
              {"name": "x", "type": "space"}
            ],
            "datasets": [
              {
                "path": "s0",
                "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
              }
            ]
          }
        ]
      }
    }
  },
  "s0/zarr.json": {
    "zarr_format": 3,
    "node_type": "array",
    "shape": [2, 4, 4],
    "data_type": "uint8"
  }
}
'''
[rules.NGFF-DS-006]
slug = 'dataset-path-present'
level = 'MUST'
summary = 'Each entry in `datasets` must contain `path`.'
introduced = '0.4'

[[rules.NGFF-DS-006.sources]]
quote = 'Each dictionary in "datasets" MUST contain the field "path"'
lines = { "0.4" = [365, 365], "0.5" = [309, 309] }

[rules.NGFF-DS-006.example]
model = 'Dataset'
json = '''
{"coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]}
'''

[rules.NGFF-DS-007]
slug = 'dataset-transforms-present'
level = 'MUST'
summary = 'Each entry in `datasets` must contain `coordinateTransformations`.'
introduced = '0.4'

[[rules.NGFF-DS-007.sources]]
quote = 'Each dictionary in "datasets" MUST contain the field "coordinateTransformations"'
lines = { "0.4" = [369, 369], "0.5" = [313, 313] }

[rules.NGFF-DS-007.example]
model = 'Dataset'
json = '''
{"path": "0"}
'''

# ------------------------------------------------------------------------------
# NGFF-CT
# ------------------------------------------------------------------------------

[rules.NGFF-CT-001]
slug = 'scale-exactly-one'
level = 'MUST'
summary = '`coordinateTransformations` must contain exactly one `scale`.'
introduced = '0.4'

[[rules.NGFF-CT-001.sources]]
quote = 'They MUST contain exactly one `scale` transformation'
lines = { "0.4" = [371, 371], "0.5" = [315, 315] }

[rules.NGFF-CT-001.example]
model = 'Dataset'
json = '''
{
  "path": "0",
  "coordinateTransformations": [
    {"type": "scale", "scale": [1, 1]},
    {"type": "scale", "scale": [1, 1]}
  ]
}
'''

[rules.NGFF-CT-002]
slug = 'translation-at-most-one'
level = 'MAY'
summary = '`coordinateTransformations` may contain at most one `translation`.'
introduced = '0.4'

[[rules.NGFF-CT-002.sources]]
quote = 'It MAY contain exactly one `translation`'
lines = { "0.4" = [372, 372], "0.5" = [316, 316] }

[rules.NGFF-CT-002.example]
model = 'Dataset'
json = '''
{
  "path": "0",
  "coordinateTransformations": [
    {"type": "scale", "scale": [1, 1]},
    {"type": "translation", "translation": [0, 0]},
    {"type": "translation", "translation": [1, 1]}
  ]
}
'''

[rules.NGFF-CT-003]
slug = 'translation-after-scale'
level = 'MUST'
summary = 'A `translation` must be listed after the `scale`.'
introduced = '0.4'

[[rules.NGFF-CT-003.sources]]
quote = 'If `translation` is given it MUST be listed after `scale`'
lines = { "0.4" = [372, 372], "0.5" = [316, 316] }

[rules.NGFF-CT-003.example]
model = 'Dataset'
json = '''
{
  "path": "0",
  "coordinateTransformations": [
    {"type": "translation", "translation": [0, 0]},
    {"type": "scale", "scale": [1, 1]}
  ]
}
'''

[rules.NGFF-CT-004]
slug = 'transform-length-matches-axes'
level = 'MUST'
summary = '`scale` and `translation` arrays must have one entry per axis.'
introduced = '0.4'

[[rules.NGFF-CT-004.sources]]
quote = 'The length of the `scale` and `translation` array MUST be the same as the length of "axes".'
lines = { "0.4" = [373, 373], "0.5" = [317, 317] }

[rules.NGFF-CT-004.example]
model = 'Multiscale'
json = '''
{
  "axes": [{"name": "y", "type": "space"}, {"name": "x", "type": "space"}],
  "datasets": [
    {
      "path": "0",
      "coordinateTransformations": [{"type": "scale", "scale": [1, 1, 1]}]
    }
  ]
}
'''

# ------------------------------------------------------------------------------
# NGFF-OM
# ------------------------------------------------------------------------------

[rules.NGFF-OM-001]
slug = 'omero-channel-color-hex'
level = 'MUST'
summary = 'An omero channel `color` must be a string of 6 hexadecimal digits.'
introduced = '0.5'
notes = 'yaozarrs also accepts a leading `#` and 3-digit shorthand, and normalizes them. The same check is currently applied to 0.4 documents, although the 0.4 spec has no such statement.'

[[rules.NGFF-OM-001.sources]]
quote = 'Each dictionary in "channels" MUST contain the field "color", which is a string of 6 hexadecimal digits specifying the color of the channel in RGB format.'
lines = { "0.5" = [385, 385] }

[rules.NGFF-OM-001.example]
model = 'OmeroChannel'
json = '''
{
  "color": "GGGGGG",
  "window": {"start": 0, "end": 1, "min": 0, "max": 1}
}
'''

[rules.NGFF-OM-002]
slug = 'omero-channels-present'
level = 'MUST'
summary = '`omero` metadata, if present, must contain `channels`.'
introduced = '0.5'
notes = 'The 0.4 spec describes the omero fields without RFC 2119 keywords, but yaozarrs uses the same omero model for 0.4 documents.'

[[rules.NGFF-OM-002.sources]]
quote = 'The "omero" metadata is optional, but if present it MUST contain the field "channels"'
lines = { "0.5" = [384, 384] }

[rules.NGFF-OM-002.example]
model = 'Omero'
json = '''
{"name": "image"}
'''

[rules.NGFF-OM-003]
slug = 'omero-channel-color-present'
level = 'MUST'
summary = 'Each omero channel must contain `color`.'
introduced = '0.5'
notes = 'The 0.4 spec describes the omero fields without RFC 2119 keywords, but yaozarrs uses the same omero model for 0.4 documents.'

[[rules.NGFF-OM-003.sources]]
quote = 'Each dictionary in "channels" MUST contain the field "color"'
lines = { "0.5" = [385, 385] }

[rules.NGFF-OM-003.example]
model = 'OmeroChannel'
json = '''
{"window": {"start": 0, "end": 1, "min": 0, "max": 1}}
'''

[rules.NGFF-OM-004]
slug = 'omero-channel-window-present'
level = 'MUST'
summary = 'Each omero channel must contain `window`.'
introduced = '0.5'
notes = 'The 0.4 spec describes the omero fields without RFC 2119 keywords, but yaozarrs uses the same omero model for 0.4 documents.'

[[rules.NGFF-OM-004.sources]]
quote = 'Each dictionary in "channels" MUST contain the field "window"'
lines = { "0.5" = [386, 386] }

[rules.NGFF-OM-004.example]
model = 'OmeroChannel'
json = '''
{"color": "FF0000"}
'''

[rules.NGFF-OM-005]
slug = 'omero-window-min-max-present'
level = 'MUST'
summary = 'An omero channel `window` must contain `min` and `max`.'
introduced = '0.5'
notes = 'The 0.4 spec describes the omero fields without RFC 2119 keywords, but yaozarrs uses the same omero model for 0.4 documents.'

[[rules.NGFF-OM-005.sources]]
quote = 'The field "window" MUST contain the fields "min" and "max"'
lines = { "0.5" = [387, 387] }

[rules.NGFF-OM-005.example]
model = 'OmeroWindow'
json = '''
{"start": 0, "end": 1}
'''

[rules.NGFF-OM-006]
slug = 'omero-window-start-end-present'
level = 'MUST'
summary = 'An omero channel `window` must contain `start` and `end`.'
introduced = '0.5'
notes = 'The 0.4 spec describes the omero fields without RFC 2119 keywords, but yaozarrs uses the same omero model for 0.4 documents.'

[[rules.NGFF-OM-006.sources]]
quote = 'It MUST also contain the fields "start" and "end"'
lines = { "0.5" = [388, 388] }

[rules.NGFF-OM-006.example]
model = 'OmeroWindow'
json = '''
{"min": 0, "max": 1}
'''

# ------------------------------------------------------------------------------
# NGFF-PL
# ------------------------------------------------------------------------------

[rules.NGFF-PL-001]
slug = 'acquisition-id-unique'
level = 'MUST'
summary = 'Acquisition `id`s must be unique within a plate.'
introduced = '0.4'

[[rules.NGFF-PL-001.sources]]
quote = 'whose value MUST be an unique integer identifier greater than or equal to 0 within the context of the plate'
lines = { "0.4" = [531, 532], "0.5" = [466, 467] }

[rules.NGFF-PL-001.example]
model = 'PlateDef'
json = '''
{
  "rows": [{"name": "A"}],
  "columns": [{"name": "1"}],
  "wells": [{"path": "A/1", "rowIndex": 0, "columnIndex": 0}],
  "acquisitions": [{"id": 0}, {"id": 0, "name": "dupe"}]
}
'''

[rules.NGFF-PL-002]
slug = 'plate-column-names-case-collision'
level = 'SHOULD'
summary = 'Plate column names should not differ only by case.'
introduced = '0.4'

[[rules.NGFF-PL-002.sources]]
quote = 'other `name` in the `columns` list. Care SHOULD be taken to avoid collisions on case-insensitive filesystems'
