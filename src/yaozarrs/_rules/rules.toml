summary = 'Every output axis of a `byDimension` must appear in exactly one `outputAxes`.'
introduced = '0.6'

[[rules.NGFF-CT-037.sources]]
quote = "Every axis index in the parent byDimension's `output` coordinate system MUST appear in exactly one child transformation's `outputAxes` array."
lines = { "0.6" = [1179, 1180] }

