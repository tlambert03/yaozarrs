# Registry of rule codes: one entry per normative statement in the NGFF spec
# (`NGFF-*`), plus checks yaozarrs adds beyond the spec (`YZ-*`).
#
# Codes are permanent: never renumber or reuse one. Line numbers are maintained by
# `uv run python scripts/ngff_rules.py check --fix`; never edit them by hand.
# See `.claude/skills/ngff-rules/SKILL.md` for how to add, change, or retire rules.

# Spec source files, pinned to immutable commits. Keys are the tracked versions.

[spec."0.4"]
tag = '0.4.1'
repo = 'ome/ngff'
sha = '106c3010dcb4079eb0a69868a11cc5943f942fdf'
path = '0.4/index.bs'

[spec."0.5"]
tag = '0.5.2'
repo = 'ome/ngff'
sha = '5cdf83b6806b5e500477c7af69dae9ed2adcf77d'
path = '0.5/index.bs'

[spec."0.6"]
tag = '0.6'
repo = 'ome/ngff-spec'
sha = '89da1da5b0491f83b7cdde7d123aef763a457029'
path = 'index.md'

# ------------------------------------------------------------------------------
# NGFF-AX
# ------------------------------------------------------------------------------

[rules.NGFF-AX-001]
slug = 'axis-name-unique'
level = 'MUST'
summary = 'Axis names must be unique within `axes`.'
introduced = '0.4'

[[rules.NGFF-AX-001.sources]]
quote = 'The values MUST be unique across all "name" fields.'
lines = { "0.4" = [243, 243], "0.5" = [183, 183] }

[[rules.NGFF-AX-001.sources]]
quote = 'The values in the `name` fields MUST be unique within the same coordinate system.'
lines = { "0.6" = [260, 260] }

[rules.NGFF-AX-001.example]
model = 'Multiscale'
json = '''
{
  "axes": [
    {"name": "x", "type": "space"},
    {"name": "x", "type": "space", "unit": "meter"}
  ],
  "datasets": [
    {
      "path": "0",
      "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
    }
  ]
}
'''

[rules.NGFF-AX-002]
slug = 'axes-space-count'
level = 'MUST'
summary = '`axes` must contain 2 or 3 axes of type `space`.'
introduced = '0.4'
notes = 'For 0.6, yaozarrs only warns about a coordinate system with no `space` axes but at least two `array` axes: the prose forbids it, but the JSON schema allows it.'

[[rules.NGFF-AX-002.sources]]
quote = 'The "axes" MUST contain 2 or 3 entries of "type:space"'
lines = { "0.4" = [360, 360], "0.5" = [304, 304] }

[[rules.NGFF-AX-002.sources]]
quote = '`axes` MUST contain 2 or 3 entries of `type:space`'
lines = { "0.6" = [1289, 1289] }

[rules.NGFF-AX-002.example]
model = 'Multiscale'
json = '''
{
  "axes": [{"name": "c", "type": "channel"}, {"name": "x", "type": "space"}],
  "datasets": [
    {
      "path": "0",
      "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
    }
  ]
}
'''

[rules.NGFF-AX-003]
slug = 'axes-time-at-most-one'
level = 'MAY'
summary = '`axes` may contain at most one axis of type `time`.'
introduced = '0.4'

[[rules.NGFF-AX-003.sources]]
quote = 'MAY contain one additional entry of "type:time"'
lines = { "0.4" = [360, 360], "0.5" = [304, 304] }

[[rules.NGFF-AX-003.sources]]
quote = 'MAY contain one additional entry of `type:time`'
lines = { "0.6" = [1290, 1290] }

[rules.NGFF-AX-003.example]
model = 'Multiscale'
json = '''
{
  "axes": [
    {"name": "t", "type": "time"},
    {"name": "t2", "type": "time"},
    {"name": "y", "type": "space"},
    {"name": "x", "type": "space"}
  ],
  "datasets": [
    {
      "path": "0",
      "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
    }
  ]
}
'''

[rules.NGFF-AX-004]
slug = 'axes-channel-at-most-one'
level = 'MAY'
summary = '`axes` may contain at most one axis of type `channel` (or of a null/custom type).'
introduced = '0.4'
notes = 'yaozarrs currently only counts axes of type `channel`; multiple null/custom axes are not rejected.'

[[rules.NGFF-AX-004.sources]]
quote = 'MAY contain one additional entry of "type:channel" or a null / custom type'
lines = { "0.4" = [360, 360], "0.5" = [304, 304] }

[[rules.NGFF-AX-004.sources]]
quote = 'MAY contain one additional entry of `type:channel` or a null / custom type'
lines = { "0.6" = [1291, 1291] }

[rules.NGFF-AX-004.example]
model = 'Multiscale'
json = '''
{
  "axes": [
    {"name": "c", "type": "channel"},
    {"name": "c2", "type": "channel"},
    {"name": "y", "type": "space"},
    {"name": "x", "type": "space"}
  ],
  "datasets": [
    {
      "path": "0",
      "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
    }
  ]
}
'''

[rules.NGFF-AX-005]
slug = 'axes-type-order'
level = 'MUST'
summary = 'Axes must be ordered by type: `time` (if present), then `channel` or custom (if present), then `space`.'
introduced = '0.4'

[[rules.NGFF-AX-005.sources]]
quote = 'the entries MUST be ordered by "type" where the "time" axis must come first (if present), followed by the "channel" or custom axis (if present) and the axes of type "space".'
lines = { "0.4" = [361, 361], "0.5" = [305, 305] }

[[rules.NGFF-AX-005.sources]]
quote = '`axes` entries MUST be ordered by `type` where the `time` axis must come first (if present), followed by the `channel` or custom axis (if present) and the axes of type `space`.'
lines = { "0.6" = [1292, 1293] }

[rules.NGFF-AX-005.example]
model = 'Multiscale'
json = '''
{
  "axes": [
    {"name": "y", "type": "space"},
    {"name": "t", "type": "time"},
    {"name": "x", "type": "space"}
  ],
  "datasets": [
    {
      "path": "0",
      "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
    }
  ]
}
'''

[rules.NGFF-AX-006]
slug = 'axis-unit-recognized'
level = 'SHOULD'
summary = 'An axis `unit` should be one of the UDUNITS-2 units in the spec.'
introduced = '0.4'
notes = 'yaozarrs checks this for `space` and `time` axes.'

[[rules.NGFF-AX-006.sources]]
quote = 'The value SHOULD be one of the following strings, which are valid units according to UDUNITS-2.'
lines = { "0.4" = [245, 245], "0.5" = [185, 185], "0.6" = [252, 253] }

[rules.NGFF-AX-006.example]
model = 'SpaceAxis'
json = '''
{"name": "x", "type": "space", "unit": "lightyear"}
'''


[rules.NGFF-AX-007]
slug = 'dimension-names-present'
level = 'MUST'
summary = "Each multiscale array's `zarr.json` must include `dimension_names`."
introduced = '0.5'
removed = '0.6'
severity = 'warning'
notes = 'yaozarrs only warns, because zarr-python omits `dimension_names` unless it is passed explicitly.'

[[rules.NGFF-AX-007.sources]]
quote = 'The "dimension_names" attribute MUST be included in the `zarr.json` of the Zarr array of a multiscale level'
lines = { "0.5" = [191, 191] }

[rules.NGFF-AX-007.example]
store = '''
{
  "zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {
      "ome": {
        "version": "0.5",
        "multiscales": [
          {
            "axes": [
              {"name": "y", "type": "space"},
              {"name": "x", "type": "space"}
            ],
            "datasets": [
              {
                "path": "s0",
                "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
              }
            ]
          }
        ]
      }
    }
  },
  "s0/zarr.json": {
    "zarr_format": 3,
    "node_type": "array",
    "shape": [4, 4],
    "data_type": "uint8"
  }
}
'''

[rules.NGFF-AX-008]
slug = 'dimension-names-match-axes'
level = 'MUST'
summary = "An array's `dimension_names` must match the names in `axes`."
introduced = '0.5'
removed = '0.6'
notes = 'For 0.4 stores, yaozarrs checks a non-standard `dimension_names` array attribute if it is present.'

[[rules.NGFF-AX-008.sources]]
quote = 'and MUST match the names in the "axes" metadata.'
lines = { "0.5" = [191, 191] }

[rules.NGFF-AX-008.example]
store = '''
{
  "zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {
      "ome": {
        "version": "0.5",
        "multiscales": [
          {
            "axes": [
              {"name": "y", "type": "space"},
              {"name": "x", "type": "space"}
            ],
            "datasets": [
              {
                "path": "s0",
                "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
              }
            ]
          }
        ]
      }
    }
  },
  "s0/zarr.json": {
    "zarr_format": 3,
    "node_type": "array",
    "shape": [4, 4],
    "data_type": "uint8",
    "dimension_names": ["a", "b"]
  }
}
'''
[rules.NGFF-AX-009]
slug = 'axis-name-present'
level = 'MUST'
summary = 'Each axis must have a `name`.'
introduced = '0.4'

[[rules.NGFF-AX-009.sources]]
quote = 'MUST contain the field "name" that gives the name for this dimension.'
lines = { "0.4" = [243, 243], "0.5" = [183, 183] }

[[rules.NGFF-AX-009.sources]]
quote = 'MUST contain the field `name` that gives the name for this dimension.'
lines = { "0.6" = [243, 243] }

[rules.NGFF-AX-009.example]
model = 'Multiscale'
json = '''
{
  "axes": [{"type": "space"}, {"name": "x", "type": "space"}],
  "datasets": [{"path": "0", "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]}]
}
'''

[rules.NGFF-AX-010]
slug = 'axis-name-nonempty-string'
level = 'MUST'
summary = 'An axis `name` must be a non-empty string.'
introduced = '0.6'

[[rules.NGFF-AX-010.sources]]
quote = 'The value MUST be a non-empty string.'
lines = { "0.6" = [244, 244] }

[rules.NGFF-AX-010.examples."0.6"]
model = 'SpaceAxis'
json = '''
{"name": ""}
'''


[rules.NGFF-AX-011]
slug = 'axis-long-name-string'
level = 'MUST'
summary = 'An axis `longName`, if present, must be a string.'
introduced = '0.6'

[[rules.NGFF-AX-011.sources]]
quote = 'MAY contain the field `longName`. The value MUST be a string'
lines = { "0.6" = [256, 257] }

[rules.NGFF-AX-011.examples."0.6"]
model = 'SpaceAxis'
json = '''
{"name": "x", "longName": 1}
'''


[rules.NGFF-AX-012]
slug = 'axis-discrete-boolean'
level = 'MUST'
summary = 'An axis `discrete`, if present, must be a boolean.'
introduced = '0.6'

[[rules.NGFF-AX-012.sources]]
quote = 'MAY contain the field `discrete`. The value MUST be a boolean'
lines = { "0.6" = [248, 249] }

[rules.NGFF-AX-012.examples."0.6"]
model = 'SpaceAxis'
json = '''
{"name": "x", "discrete": "nope"}
'''


[rules.NGFF-AX-013]
slug = 'multiscale-axes-min-count'
level = 'MUST'
summary = 'A coordinate system inside `multiscales` must have at least 2 axes.'
introduced = '0.6'
notes = 'The 0.6 spec writes this in lowercase, as the start of a sentence that continues with MUST. The upper limit is NGFF-DS-003.'

[[rules.NGFF-AX-013.sources]]
quote = 'The length of `axes` must be between 2 and 5'
implied = true
lines = { "0.6" = [1288, 1288] }

[rules.NGFF-AX-013.examples."0.6"]
model = 'Multiscale'
json = '''
{"coordinateSystems": [{"name": "physical", "axes": [{"name": "x", "type": "space"}]}], "datasets": [{"path": "s0", "coordinateTransformations": [{"type": "scale", "scale": [1], "input": {"path": "s0"}, "output": {"name": "physical"}}]}]}
'''

# ------------------------------------------------------------------------------
# NGFF-CS
# ------------------------------------------------------------------------------

[rules.NGFF-CS-001]
slug = 'coordinate-system-name-present'
level = 'MUST'
summary = 'A coordinate system must contain `name`.'
introduced = '0.6'

[[rules.NGFF-CS-001.sources]]
quote = 'Every coordinate system: - MUST contain the field `name`.'
lines = { "0.6" = [199, 200] }

[rules.NGFF-CS-001.examples."0.6"]
model = 'CoordinateSystem'
json = '''
{"axes": [{"name": "y", "type": "space"}, {"name": "x", "type": "space"}]}
'''


[rules.NGFF-CS-002]
slug = 'coordinate-system-name-nonempty-string'
level = 'MUST'
summary = 'A coordinate system `name` must be a non-empty string.'
introduced = '0.6'

[[rules.NGFF-CS-002.sources]]
quote = 'The value MUST be a non-empty string that is unique among all entries in a `coordinateSystems` array.'
lines = { "0.6" = [201, 201] }

[rules.NGFF-CS-002.examples."0.6"]
model = 'CoordinateSystem'
json = '''
{"name": "", "axes": [{"name": "y", "type": "space"}, {"name": "x", "type": "space"}]}
'''


[rules.NGFF-CS-003]
slug = 'coordinate-system-name-unique'
level = 'MUST'
summary = 'Coordinate system names must be unique within a `coordinateSystems` array.'
introduced = '0.6'

[[rules.NGFF-CS-003.sources]]
quote = 'The value MUST be a non-empty string that is unique among all entries in a `coordinateSystems` array.'
lines = { "0.6" = [201, 201] }

[rules.NGFF-CS-003.examples."0.6"]
model = 'Multiscale'
json = '''
{"coordinateSystems": [{"name": "physical", "axes": [{"name": "y", "type": "space"}, {"name": "x", "type": "space"}]}, {"name": "physical", "axes": [{"name": "z", "type": "space"}, {"name": "y", "type": "space"}, {"name": "x", "type": "space"}]}], "datasets": [{"path": "s0", "coordinateTransformations": [{"type": "scale", "scale": [1, 1], "input": {"path": "s0"}, "output": {"name": "physical"}}]}]}
'''


[rules.NGFF-CS-004]
slug = 'coordinate-system-axes-present'
level = 'MUST'
summary = 'A coordinate system must contain `axes`, an array.'
introduced = '0.6'

[[rules.NGFF-CS-004.sources]]
quote = 'MUST contain the field `axes`, whose value is an array of valid `axes`'
lines = { "0.6" = [202, 202] }

[rules.NGFF-CS-004.examples."0.6"]
model = 'CoordinateSystem'
json = '''
{"name": "physical"}
'''

# ------------------------------------------------------------------------------
# NGFF-MS
# ------------------------------------------------------------------------------

[rules.NGFF-MS-001]
slug = 'multiscales-name'
level = 'SHOULD'
summary = 'Each "multiscales" dictionary should contain the field "name".'
introduced = '0.4'

[[rules.NGFF-MS-001.sources]]
quote = 'Each "multiscales" dictionary SHOULD contain the field "name".'
lines = { "0.4" = [380, 380], "0.5" = [324, 324] }

[[rules.NGFF-MS-001.sources]]
quote = 'Each `multiscales` object SHOULD contain the field `name`.'
lines = { "0.6" = [1386, 1386] }

[rules.NGFF-MS-002]
slug = 'multiscales-axes-present'
level = 'MUST'
summary = 'Each "multiscales" entry must contain `axes`.'
introduced = '0.4'
removed = '0.6'

[[rules.NGFF-MS-002.sources]]
quote = 'Each "multiscales" dictionary MUST contain the field "axes"'
lines = { "0.4" = [358, 358], "0.5" = [302, 302] }

[rules.NGFF-MS-002.example]
model = 'Multiscale'
json = '''
{
  "datasets": [{"path": "0", "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]}]
}
'''

[rules.NGFF-MS-003]
slug = 'multiscales-datasets-present'
level = 'MUST'
summary = 'Each "multiscales" entry must contain `datasets`.'
introduced = '0.4'
notes = 'The 0.6 spec states this in the `multiscales` field table ("Required: yes"), not with a keyword.'

[[rules.NGFF-MS-003.sources]]
quote = 'Each "multiscales" dictionary MUST contain the field "datasets"'
lines = { "0.4" = [364, 364], "0.5" = [308, 308] }

[[rules.NGFF-MS-003.sources]]
quote = '| `datasets` | JSON array of objects | yes |'
implied = true
lines = { "0.6" = [1278, 1278] }

[rules.NGFF-MS-003.example]
model = 'Multiscale'
json = '''
{"axes": [{"name": "y", "type": "space"}, {"name": "x", "type": "space"}]}
'''

[rules.NGFF-MS-004]
slug = 'multiscales-coordinate-systems-present'
level = 'MUST'
summary = 'Each `multiscales` entry must contain `coordinateSystems`.'
introduced = '0.6'
supersedes = ['NGFF-MS-002']
notes = 'The 0.6 spec states this in the `multiscales` field table ("Required: yes"), not with a keyword. Replaces `axes` (NGFF-MS-002).'

[[rules.NGFF-MS-004.sources]]
quote = '| `coordinateSystems` | JSON array of objects | yes |'
implied = true
lines = { "0.6" = [1277, 1277] }

[rules.NGFF-MS-004.examples."0.6"]
model = 'Multiscale'
json = '''
{"datasets": [{"path": "s0", "coordinateTransformations": [{"type": "scale", "scale": [1, 1], "input": {"path": "s0"}, "output": {"name": "physical"}}]}]}
'''

# ------------------------------------------------------------------------------
# NGFF-DS
# ------------------------------------------------------------------------------

[rules.NGFF-DS-001]
slug = 'datasets-resolution-order'
level = 'MUST'
summary = '`datasets` must be ordered from highest to lowest resolution.'
introduced = '0.4'
notes = 'yaozarrs compares the `scale` values of the spatial axes: per axis, a scale may not shrink from one level to the next (allowing for float noise). For 0.6, it compares their magnitudes, as scales may be negative.'

[[rules.NGFF-DS-001.sources]]
quote = 'The "path"s MUST be ordered from largest (i.e. highest resolution) to smallest.'
lines = { "0.4" = [366, 366], "0.5" = [310, 310] }

[[rules.NGFF-DS-001.sources]]
quote = 'The `path`s MUST be ordered from largest (i.e. highest resolution) to smallest.'
lines = { "0.6" = [1312, 1312] }

[rules.NGFF-DS-001.example]
model = 'Multiscale'
json = '''
{
  "axes": [{"name": "y", "type": "space"}, {"name": "x", "type": "space"}],
  "datasets": [
    {
      "path": "0",
      "coordinateTransformations": [{"type": "scale", "scale": [2, 2]}]
    },
    {
      "path": "1",
      "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
    }
  ]
}
'''

[rules.NGFF-DS-002]
slug = 'datasets-same-ndim'
level = 'MUST'
summary = 'All `datasets` must have the same number of dimensions.'
introduced = '0.4'
notes = "The spec does not define a dataset's number of dimensions; yaozarrs uses the length of its coordinate transformations."

[[rules.NGFF-DS-002.sources]]
quote = 'Each "datasets" dictionary MUST have the same number of dimensions'
lines = { "0.4" = [368, 368], "0.5" = [312, 312] }

[[rules.NGFF-DS-002.sources]]
quote = 'Every Zarr array referred to by a `path` MUST have the same number of dimensions and datatype,'
lines = { "0.6" = [1313, 1313] }

[rules.NGFF-DS-002.example]
model = 'Multiscale'
json = '''
{
  "axes": [{"name": "y", "type": "space"}, {"name": "x", "type": "space"}],
  "datasets": [
    {
      "path": "0",
      "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
    },
    {
      "path": "1",
      "coordinateTransformations": [{"type": "scale", "scale": [2, 2, 2]}]
    }
  ]
}
'''

[rules.NGFF-DS-003]
slug = 'datasets-max-5d'
level = 'MUST'
summary = '`datasets` must not have more than 5 dimensions.'
introduced = '0.4'

[[rules.NGFF-DS-003.sources]]
quote = 'MUST NOT have more than 5 dimensions.'
lines = { "0.4" = [368, 368], "0.5" = [312, 312], "0.6" = [1314, 1314] }

[rules.NGFF-DS-003.example]
model = 'Multiscale'
json = '''
{
  "axes": [{"name": "y", "type": "space"}, {"name": "x", "type": "space"}],
  "datasets": [
    {
      "path": "0",
      "coordinateTransformations": [{"type": "scale", "scale": [1, 1, 1, 1, 1, 1]}]
    }
  ]
}
'''

[rules.NGFF-DS-003.examples."0.6"]
model = 'Multiscale'
json = '''
{
  "coordinateSystems": [
    {
      "name": "physical",
      "axes": [
        {"name": "a"},
        {"name": "b"},
        {"name": "c"},
        {"name": "z", "type": "space"},
        {"name": "y", "type": "space"},
        {"name": "x", "type": "space"}
      ]
    }
  ],
  "datasets": [
    {
      "path": "0",
      "coordinateTransformations": [
        {
          "type": "scale",
          "scale": [1, 1, 1, 1, 1, 1],
          "input": {"path": "0"},
          "output": {"name": "physical"}
        }
      ]
    }
  ]
}
'''


[rules.NGFF-DS-004]
slug = 'dataset-path-is-array'
level = 'MUST'
summary = 'Each `datasets` "path" must point to a Zarr array, relative to the image group.'
introduced = '0.4'

[[rules.NGFF-DS-004.sources]]
quote = 'Each dictionary in "datasets" MUST contain the field "path", whose value contains the path to the array for this resolution relative'
lines = { "0.4" = [365, 365], "0.5" = [309, 309] }

[[rules.NGFF-DS-004.sources]]
quote = 'Each object in `datasets` MUST contain the field `path`, whose value is a string containing the path to the Zarr array for this resolution relative'
lines = { "0.6" = [1310, 1311] }

[rules.NGFF-DS-004.example]
store = '''
{
  "zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {
      "ome": {
        "version": "0.5",
        "multiscales": [
          {
            "axes": [
              {"name": "y", "type": "space"},
              {"name": "x", "type": "space"}
            ],
            "datasets": [
              {
                "path": "s0",
                "coordinateTransformations": [{"type": "scale", "scale": [1, 1]}]
              }
            ]
          }
        ]
      }
    }
  }
}
'''

[rules.NGFF-DS-005]
slug = 'array-ndim-matches-axes'
level = 'MUST'
summary = 'Each multiscale array must have one dimension per axis.'
introduced = '0.4'

[[rules.NGFF-DS-005.sources]]
quote = 'MUST be equal to the dimensionality of the zarr arrays storing the image data (see "datasets:path").'
lines = { "0.4" = [359, 359], "0.5" = [303, 303] }

[[rules.NGFF-DS-005.sources]]
quote = 'MUST be equal to the dimensionality of the Zarr arrays storing the image data (see `datasets:path`).'
lines = { "0.6" = [1288, 1288] }

[rules.NGFF-DS-005.example]
store = '''
{
  "zarr.json": {
    "zarr_format": 3,
    "node_type": "group",
    "attributes": {
      "ome": {
        "version": "0.5",
        "multiscales": [
          {
            "axes": [
