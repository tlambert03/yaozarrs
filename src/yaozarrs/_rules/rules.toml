# ------------------------------------------------------------------------------
# NGFF-CT
# ------------------------------------------------------------------------------

[rules.NGFF-CT-001]
slug = 'scale-exactly-one'
level = 'MUST'
summary = '`coordinateTransformations` must contain exactly one `scale`.'
introduced = '0.4'
removed = '0.6'

[[rules.NGFF-CT-001.sources]]
quote = 'They MUST contain exactly one `scale` transformation'
lines = { "0.4" = [371, 371], "0.5" = [315, 315] }

[rules.NGFF-CT-001.example]
model = 'Dataset'
json = '''
{
  "path": "0",
  "coordinateTransformations": [
    {"type": "scale", "scale": [1, 1]},
    {"type": "scale", "scale": [1, 1]}
  ]
}
'''

[rules.NGFF-CT-002]
slug = 'translation-at-most-one'
level = 'MAY'
summary = '`coordinateTransformations` may contain at most one `translation`.'
introduced = '0.4'
removed = '0.6'

[[rules.NGFF-CT-002.sources]]
quote = 'It MAY contain exactly one `translation`'
lines = { "0.4" = [372, 372], "0.5" = [316, 316] }

[rules.NGFF-CT-002.example]
model = 'Dataset'
json = '''
{
  "path": "0",
  "coordinateTransformations": [
    {"type": "scale", "scale": [1, 1]},
    {"type": "translation", "translation": [0, 0]},
    {"type": "translation", "translation": [1, 1]}
  ]
}
'''

[rules.NGFF-CT-003]
slug = 'translation-after-scale'
level = 'MUST'
summary = 'A `translation` must be listed after the `scale`.'
introduced = '0.4'
removed = '0.6'

[[rules.NGFF-CT-003.sources]]
quote = 'If `translation` is given it MUST be listed after `scale`'
lines = { "0.4" = [372, 372], "0.5" = [316, 316] }

[rules.NGFF-CT-003.example]
model = 'Dataset'
json = '''
{
  "path": "0",
  "coordinateTransformations": [
    {"type": "translation", "translation": [0, 0]},
    {"type": "scale", "scale": [1, 1]}
  ]
}
'''

[rules.NGFF-CT-004]
slug = 'transform-length-matches-axes'
level = 'MUST'
summary = '`scale` and `translation` arrays must have one entry per axis.'
introduced = '0.4'

[[rules.NGFF-CT-004.sources]]
quote = 'The length of the `scale` and `translation` array MUST be the same as the length of "axes".'
lines = { "0.4" = [373, 373], "0.5" = [317, 317] }

[[rules.NGFF-CT-004.sources]]
quote = 'Input and output dimensionality MUST be identical and MUST equal the length of the `translation` array (N).'
lines = { "0.6" = [807, 808] }

[[rules.NGFF-CT-004.sources]]
quote = 'Input and output dimensionality MUST be identical and MUST equal the length of the `scale` array (N).'
lines = { "0.6" = [834, 835] }

[rules.NGFF-CT-004.example]
model = 'Multiscale'
json = '''
{
  "axes": [{"name": "y", "type": "space"}, {"name": "x", "type": "space"}],
  "datasets": [
    {
      "path": "0",
      "coordinateTransformations": [{"type": "scale", "scale": [1, 1, 1]}]
    }
  ]
}
'''

[rules.NGFF-CT-005]
slug = 'dataset-transform-type'
level = 'MUST'
summary = 'A dataset must have a single transformation: a `scale`, an `identity`, or a `sequence` of a scale followed by a translation.'
introduced = '0.6'
supersedes = ['NGFF-CT-001', 'NGFF-CT-002', 'NGFF-CT-003']

[[rules.NGFF-CT-005.sources]]
quote = '`coordinateTransformations` herein MUST - be restricted to a single `scale`, `identity` or `sequence` of a scale followed by a translation transformation.'
lines = { "0.6" = [449, 450] }

[rules.NGFF-CT-005.examples."0.6"]
model = 'Dataset'
json = '''
{"path": "s0", "coordinateTransformations": [{"type": "translation", "translation": [1, 1], "input": {"path": "s0"}, "output": {"name": "physical"}}]}
'''


[rules.NGFF-CT-006]
slug = 'dataset-transform-input-path'
level = 'MUST'
summary = "The `input` of a dataset's transformation must specify a `path` matching the dataset's."
introduced = '0.6'

[[rules.NGFF-CT-006.sources]]
quote = 'The `input` object MUST specify a `path` field matching the `path` field of the dataset.'
lines = { "0.6" = [1323, 1323] }

[rules.NGFF-CT-006.examples."0.6"]
model = 'Dataset'
json = '''
{"path": "s0", "coordinateTransformations": [{"type": "scale", "scale": [1, 1], "output": {"name": "physical"}}]}
'''


[rules.NGFF-CT-007]
slug = 'dataset-transform-output-name'
level = 'MUST'
summary = "The `output` of a dataset's transformation must name a coordinate system."
introduced = '0.6'

[[rules.NGFF-CT-007.sources]]
quote = 'The `name` field of `output` MUST be the `name` of a coordinate system.'
lines = { "0.6" = [1327, 1327] }

[rules.NGFF-CT-007.examples."0.6"]
model = 'Dataset'
json = '''
{"path": "s0", "coordinateTransformations": [{"type": "scale", "scale": [1, 1], "input": {"path": "s0"}}]}
'''


[rules.NGFF-CT-008]
slug = 'dataset-transform-input-name-omitted'
level = 'SHOULD'
summary = "The `input` of a dataset's transformation should not have a `name`."
introduced = '0.6'
notes = 'Another section of the 0.6 spec says these transformations "MUST ... omit `name`", so this is only a warning.'

[[rules.NGFF-CT-008.sources]]
quote = 'The `name` field under `input` SHOULD be omitted.'
lines = { "0.6" = [1324, 1324] }

[rules.NGFF-CT-008.examples."0.6"]
